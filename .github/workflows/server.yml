name: server

on:
  push:
    paths: ['server/**', 'db/**', 'packages/core/**', 'package-lock.json', '.github/workflows/server.yml']
  pull_request:
    paths: ['server/**', 'db/**', 'packages/core/**', 'package-lock.json', '.github/workflows/server.yml']

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:test@localhost:5432/postgres
      TEST_DATABASE_URL: postgres://postgres:test@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # One install at the root covers the app, the server and packages/core (npm workspaces).
      - run: npm ci
      - run: npm run typecheck -w fobo-server
      - run: node scripts/migrate.ts
        working-directory: server
      - run: psql "$TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -f db/tests/rls.sql
      - run: npm run test:server
